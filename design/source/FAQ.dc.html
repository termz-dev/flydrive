<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FAQ — Flydrive</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F5C8C}a:hover{color:#0E1A2B}
</style>
</helmet>
<div style="font-family: Inter, system-ui, sans-serif; color: #0E1A2B; background: #FFFFFF; min-height: 100vh">
<dc-import name="SiteHeader" active="other" hint-size="100%,77px"></dc-import>

<section style="background: #F2F4F7">
<div style="max-width: 1240px; margin: 0 auto; padding: 72px 32px 56px">
<h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 56px; letter-spacing: -0.03em">Questions, answered</h1>
<p style="margin: 14px 0 0; font-size: 18px; color: #475467">Can’t find what you need? <a href="Contact.dc.html">Contact us</a>.</p>
</div>
</section>

<main style="max-width: 1240px; margin: 0 auto; padding: 48px 32px 96px; display: flex; flex-wrap: wrap; gap: 40px; align-items: flex-start">
<nav aria-label="FAQ topics" style="flex: 1 1 220px; min-width: 0; display: flex; flex-direction: column; gap: 6px">
<sc-for list="{{cats}}" as="c" hint-placeholder-count="5">
<button type="button" onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" style="{{c.style}}">{{c.label}}</button>
</sc-for>
</nav>
<section style="flex: 999 1 640px; min-width: 0; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0 0 8px; font-family: 'Space Grotesk', sans-serif; font-size: 28px">{{catTitle}}</h2>
<sc-for list="{{items}}" as="q" hint-placeholder-count="4">
<div style="border: 1px solid #E4E7EC; border-radius: 14px; overflow: hidden">
<button type="button" onClick="{{q.toggle}}" aria-expanded="{{q.expanded}}" style="font: inherit; width: 100%; text-align: left; background: #FFFFFF; border: 0; padding: 20px 22px; min-height: 44px; display: flex; justify-content: space-between; gap: 16px; align-items: center; cursor: pointer; color: #0E1A2B; font-size: 17px; font-weight: 600">
<span>{{q.q}}</span><span aria-hidden="true" style="font-size: 22px; font-weight: 400; color: #475467">{{q.sign}}</span>
</button>
<sc-if value="{{q.open}}" hint-placeholder-val="{{false}}">
<p style="margin: 0; padding: 0 22px 22px; font-size: 16px; line-height: 1.65; color: #475467">{{q.a}}</p>
</sc-if>
</div>
</sc-for>
</section>
</main>

<dc-import name="SiteFooter" hint-size="100%,420px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1900}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { cat: 'booking', open: 0 };
}
renderVals() {
var self = this;
var data = {
booking: { label: 'Booking', items: [
['How much notice do you need?', 'Standard notice is 3 days. If you need someone sooner, submit anyway — our team checks availability by hand and lets you know. Short-notice requests are never confirmed automatically.'],
['Is this like ride hailing?', 'No. You book a driver for a period — half-day, day, week or longer — and they work your schedule rather than a single trip.'],
['Can I choose my driver?', 'Yes. You see suitable drivers who are free for your dates and pick one. They then see the full assignment and accept or decline.'],
['When is my booking confirmed?', 'After your driver accepts, you pay in full, and our team verifies the payment. We tell you as soon as it is confirmed.']
] },
car: { label: 'Car + driver', items: [
['Can you provide the car as well?', 'Yes. Choose car + driver and pick a vehicle class — saloon, SUV or minivan. We match a suitable car and confirm it with your booking.'],
['Can I pick the exact model?', 'You choose the class. The specific car is confirmed with your booking.'],
['Who pays for fuel?', '[POLICY TO CONFIRM] — shown clearly before you pay.'],
['Is there a deposit?', '[POLICY TO CONFIRM] — shown clearly before you pay.']
] },
pay: { label: 'Payments', items: [
['When do I pay?', 'Only after your chosen driver has accepted. You pay the full amount, with every charge shown first.'],
['What if my driver can’t make it after I’ve paid?', 'You choose: approve a replacement driver, or take a refund.'],
['Can I reschedule?', 'Reschedule and cancellation terms are shown before payment and in your booking.']
] },
safety: { label: 'Safety', items: [
['How are drivers checked?', 'Identity, driver’s licence, a guarantor and a background check, reviewed by our team.'],
['What does “Training: Pending” mean?', 'Our road-rules assessment hasn’t started yet. Profiles show “Pending” until it does.'],
['What if something goes wrong during a booking?', 'Contact your named handler. For a safety concern, use the safety option — it goes straight to a person.']
] },
drivers: { label: 'For drivers', items: [
['How do I join?', 'Apply online. We’ll contact you to arrange identity, licence, guarantor and background checks.'],
['Do I have to accept every offer?', 'No. You see the full assignment first and declining never counts against you.']
] }
};
var order = ['booking', 'car', 'pay', 'safety', 'drivers'];
var cur = this.state.cat;
var cats = order.map(function (id) {
var on = id === cur;
return {
label: data[id].label,
pressed: on ? 'true' : 'false',
pick: function () { self.setState({ cat: id, open: 0 }); },
style: 'font: inherit; text-align: left; cursor: pointer; border: 0; border-radius: 10px; padding: 12px 16px; min-height: 44px; font-size: 15px; ' + (on ? 'background: #0E1A2B; color: #FFFFFF; font-weight: 600' : 'background: transparent; color: #0E1A2B; font-weight: 500')
};
});
var openIdx = this.state.open;
var items = data[cur].items.map(function (pair, i) {
var isOpen = i === openIdx;
return {
q: pair[0], a: pair[1], open: isOpen,
expanded: isOpen ? 'true' : 'false',
sign: isOpen ? '−' : '+',
toggle: function () { self.setState({ open: isOpen ? -1 : i }); }
};
});
return { cats: cats, items: items, catTitle: data[cur].label };
}
}
</script>
</body>
</html>
